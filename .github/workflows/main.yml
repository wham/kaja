name: main
# What a push to main ships: the published image, and the public demo.
#
# The two are independent builds of the same commit and run in parallel — the
# demo builds `workspace/` into the image it runs, so it has nothing to wait for
# the Docker Hub push to hand it.
on:
  push:
    branches:
      - "main"
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            kajatools/kaja:latest
          build-args: |
            GIT_REF=${{ github.sha }}

  # demo.kaja.tools, deployed from the commit that changed it rather than from
  # whatever image happened to be published when something else deployed. This
  # is the same app and the same certificate as before; only what deploys it
  # moved here.
  #
  # Uses the FLY_API_TOKEN the preview workflow already needs. GIT_REF is what
  # the running Kaja reports as its version, so the demo names its own commit.
  demo:
    runs-on: ubuntu-latest
    # A Fly deploy of an app must not overlap with another of the same app.
    concurrency: deploy-demo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The demo shows the apps worth showing a first-time visitor, which is
      # fewer than a developer works with. It is a cut made to the checkout on
      # the way to the build - one kaja.json in the repository, and nothing in
      # kaja that knows a deployment can hide an app - so a preview and a
      # developer still get every one of them.
      - name: Leave the exercise apps out of the demo workspace
        run: |
          set -euo pipefail
          hidden='["grpcb.in", "quirks"]'
          for name in $(echo "$hidden" | jq -r '.[]'); do
            if ! jq -e --arg name "$name" 'any(.apps[]; .name == $name)' workspace/kaja.json > /dev/null; then
              echo "::error::No app in workspace/kaja.json is called '$name'"
              exit 1
            fi
          done
          jq --argjson hidden "$hidden" \
            '.apps |= map(select(.name as $name | $hidden | index($name) | not))' \
            workspace/kaja.json > workspace/kaja.demo.json
          mv workspace/kaja.demo.json workspace/kaja.json
          jq -r '"Demo apps: " + ([.apps[].name] | join(", "))' workspace/kaja.json

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN secret is not set — create one with 'fly tokens create org <org>'"
            exit 1
          fi
          flyctl deploy . \
            --config deploy/demo/fly.toml \
            --build-arg GIT_REF="${{ github.sha }}" \
            --remote-only \
            --yes
