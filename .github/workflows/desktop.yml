name: desktop
on:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            server/go.sum
            desktop/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # The runner an exported app is made of, embedded into the app. It is built
      # for this platform, which is what makes an exported app run where Kaja
      # runs; it carries the player as an embedded bundle, so the UI is built
      # into server/build first.
      - name: Build the export runner
        run: |
          cd ui && bun install --silent && cd ..
          cd server
          go run cmd/build-ui/main.go
          go build -o ../desktop/build/runner/kaja-run ./cmd/kaja-run

      - name: Build desktop app
        run: |
          source ../scripts/common
          export_macos_deployment_target
          wails build
        working-directory: desktop
