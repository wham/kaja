<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="An agent writes and runs a script over MCP; every call it makes lands on Kaja's canvas, and Kaja speaks gRPC, OpenAPI, MCP and Twirp to your apps." fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .node { fill: #fafafa; stroke: #737373; }
    .frame { stroke: #737373; }
    .wire { stroke: #d4d4d4; }
    .ink { stroke: #171717; }
    .name { fill: #171717; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .said { fill: #737373; font: 400 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .small { fill: #737373; font: 400 10px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kind { fill: #737373; font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .said-wire { fill: #737373; font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.2px; }

    @media (prefers-color-scheme: dark) {
      .node { fill: #171717; stroke: #a3a3a3; }
      .frame { stroke: #a3a3a3; }
      .wire { stroke: #3a3a3a; }
      .ink { stroke: #fafafa; }
      .name { fill: #fafafa; }
      .said, .small, .kind, .said-wire { fill: #a3a3a3; }
    }
  </style>

  <g class="wire" stroke-width="1.5">
    <path d="M540 150 C 600 150, 620 62, 680 62" />
    <path d="M540 150 C 600 150, 620 122, 680 122" />
    <path d="M540 150 C 600 150, 620 182, 680 182" />
    <path d="M540 150 C 600 150, 620 242, 680 242" />
    <path d="M220 150 H 340" />
  </g>
  <g class="frame" stroke-width="1.5">
    <path d="M334 146l6 4-6 4M674 58l6 4-6 4M674 118l6 4-6 4M674 178l6 4-6 4M674 238l6 4-6 4" />
  </g>
  <text class="said-wire" x="270" y="140" text-anchor="middle">MCP</text>
  <text class="said-wire" x="610" y="112" text-anchor="middle">CALLS</text>

  <rect class="node" x="20" y="110" width="200" height="80" rx="8" stroke-width="1.5" />
  <g class="ink" stroke-width="2" transform="translate(40 134)">
    <rect x="3" y="8" width="18" height="13" rx="3" />
    <path d="M12 8V4M9 4h6" />
    <path d="M8.5 14.5v.01M15.5 14.5v.01" />
  </g>
  <text class="name" x="74" y="146">An agent</text>
  <text class="said" x="74" y="164">writes the script, runs it</text>

  <rect class="node" x="340" y="60" width="200" height="180" rx="8" stroke-width="1.5" />
  <path class="frame" stroke-width="1.5" d="M340 90h200" />
  <path class="ink" stroke-width="2" d="M356 75h5l3-6 4 12 3-6h5" />
  <text class="name" x="384" y="79">Kaja</text>
  <text class="small" x="524" y="79" text-anchor="end">canvas</text>
  <g class="wire" stroke-width="1.5">
    <path d="M358 110h96M358 122h64" />
    <rect x="358" y="138" width="164" height="42" rx="3" />
    <path d="M358 152h164M413 138v42M468 138v42" />
    <rect x="358" y="194" width="164" height="30" rx="3" />
  </g>
  <g class="frame" stroke-width="1.5">
    <path d="M370 209h4l2-4 3 8 2-4h4" />
    <path d="M394 209h78" />
    <path d="M496 205l3 4 6-8" />
  </g>
  <text class="said" x="440" y="270" text-anchor="middle">every call lands here, for you to see and approve</text>

  <rect class="node" x="680" y="40" width="176" height="44" rx="8" stroke-width="1.5" />
  <g class="ink" stroke-width="2" transform="translate(694 52) scale(0.8333)">
    <circle cx="6" cy="12" r="2.5" />
    <circle cx="18" cy="12" r="2.5" />
    <path d="M8.5 9.5h7M8.5 14.5h7" />
  </g>
  <text class="name" x="724" y="66">gRPC</text>
  <text class="kind" x="842" y="66" text-anchor="end">.proto</text>

  <rect class="node" x="680" y="100" width="176" height="44" rx="8" stroke-width="1.5" />
  <g class="ink" stroke-width="2" transform="translate(694 112) scale(0.8333)">
    <circle cx="6" cy="12" r="2.5" />
    <path d="M8.5 12h6M8.3 10.8 16 6M8.3 13.2 16 18" />
    <circle cx="18" cy="12" r="1.25" />
    <circle cx="18" cy="5" r="1.25" />
    <circle cx="18" cy="19" r="1.25" />
  </g>
  <text class="name" x="724" y="126">OpenAPI</text>
  <text class="kind" x="842" y="126" text-anchor="end">schema</text>

  <rect class="node" x="680" y="160" width="176" height="44" rx="8" stroke-width="1.5" />
  <g class="ink" stroke-width="2" transform="translate(694 172) scale(0.8333)">
    <path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z" />
    <circle cx="12" cy="12" r="2.5" />
  </g>
  <text class="name" x="724" y="186">MCP</text>
  <text class="kind" x="842" y="186" text-anchor="end">tools</text>

  <rect class="node" x="680" y="220" width="176" height="44" rx="8" stroke-width="1.5" />
  <g class="ink" stroke-width="2" transform="translate(694 232) scale(0.8333)">
    <circle cx="6" cy="12" r="2.5" />
    <path d="M8.5 12H15" />
    <rect x="15" y="8.5" width="5" height="7" rx="1" />
  </g>
  <text class="name" x="724" y="246">Twirp</text>
  <text class="kind" x="842" y="246" text-anchor="end">.proto</text>
</svg>
