syntax = "proto3";

option go_package = "pkg/api";

service Api {
  rpc Compile(CompileRequest) returns (CompileResponse);
  rpc OpenApp(OpenAppRequest) returns (OpenAppResponse);
  rpc InspectOpenApi(InspectOpenApiRequest) returns (InspectOpenApiResponse);
  rpc InspectGrpc(InspectGrpcRequest) returns (InspectGrpcResponse);
  rpc InspectMcp(InspectMcpRequest) returns (InspectMcpResponse);
  rpc GetConfiguration(GetConfigurationRequest) returns (GetConfigurationResponse);
  rpc UpdateConfiguration(UpdateConfigurationRequest) returns (UpdateConfigurationResponse);
  rpc SetStoredValue(SetStoredValueRequest) returns (StoredValueResponse);
  rpc ClearStoredValue(ClearStoredValueRequest) returns (StoredValueResponse);
}

message CompileRequest {
  string id = 1;
  int32 log_offset = 2;
  string proto_dir = 3;
}

enum OpenStatus {
  OPEN_STATUS_UNKNOWN = 0;
  OPEN_STATUS_OK = 1;
  OPEN_STATUS_ERROR = 2;
}

// OpenApp opens an app from its configuration. "grpc"/
// "twirp" apps describe a gRPC/Twirp service (proto files come from a static
// directory or gRPC reflection), while built-in apps like "openapi" or "folder"
// generate their own proto surface. In all cases the app produces proto files to
// feed into Compile, an invocation target, and the transport protocol the client
// uses to reach it. The server flattens the app's typed parameters to a string map
// for the in-process app contract.
message OpenAppRequest {
  ConfigurationApp app = 1;
}

message OpenAppResponse {
  OpenStatus status = 1;
  repeated Log logs = 2;
  // Directory containing the proto files to compile (only set on success). Either a
  // temp directory (generated/reflected protos) or a workspace-relative path (static
  // protos), which Compile resolves against the workspace.
  string proto_dir = 3;
  // Invocation target: the upstream URL for grpc/twirp apps, or "kaja-app://<id>"
  // for in-process apps (only set on success).
  string target = 4;
  // Transport the client uses to reach the target: "grpc" or "twirp".
  string protocol = 5;
}

// InspectGrpc reads the service surface a grpc app *would* be opened with -
// reflecting the server, or reading the proto directory - without creating the
// app, so the New gRPC app form can fill itself in from what answered. The app
// carries the same parameters the app would be opened with, credentials
// included: a server may well ask for them before it reflects.
message InspectGrpcRequest {
  GrpcApp grpc = 1;
}

message InspectGrpcResponse {
  // Set when the surface was read; the form fills itself in from it.
  GrpcServer server = 1;
  // Set when it wasn't; the form shows it in place of the summary.
  GrpcProblem problem = 2;
}

message GrpcServer {
  // Where the surface came from: "reflection" or "proto_dir".
  string source = 1;
  // The gRPC target that answered, e.g. "dns:seating.kaja.tools:443". Empty for
  // the proto_dir source, which reaches no server.
  string target = 2;
  // Whether the connection that answered used TLS. When the app leaves the
  // choice to the URL, this is what kaja settled on by trying, and the form
  // writes it back so the app says outright what it does.
  bool tls = 3;
  repeated GrpcService services = 4;
  int32 method_count = 5;
  // The reflection API the server answered: "v1" or "v1alpha".
  string reflection_version = 6;
  // Proto files read, for the proto_dir source.
  int32 file_count = 7;
  // The directory the proto files were read from, resolved against the
  // workspace, for the proto_dir source.
  string proto_dir = 8;
  // Whether the server answered at all. Always true for the reflection source,
  // which is nothing but the server answering; for the proto_dir source it is
  // the separate question of whether the address is live, which the proto files
  // can't say and which doesn't stop the app being configured.
  bool reachable = 9;
}

message GrpcService {
  // Fully qualified name, e.g. "seating.Seating".
  string name = 1;
  int32 method_count = 2;
  // Methods that stream in either direction. gRPC-Web can't carry them, so on
  // the web they are listed but can't be called.
  int32 streaming_method_count = 3;
}

// GrpcProblem is a surface that couldn't be read, classified so the form can
// name the next move instead of printing a raw error.
message GrpcProblem {
  GrpcProblemKind kind = 1;
  // One line, addressed to the user.
  string message = 2;
  // The underlying transport, reflection or compiler error, verbatim.
  string detail = 3;
}

enum GrpcProblemKind {
  GRPC_PROBLEM_UNKNOWN = 0;
  // The host couldn't be reached (DNS, TCP).
  GRPC_PROBLEM_UNREACHABLE = 1;
  // The TLS handshake failed, which usually means the transport is set the
  // wrong way round or the certificate isn't trusted.
  GRPC_PROBLEM_TLS = 2;
  // The server answered but doesn't serve the reflection API.
  GRPC_PROBLEM_NO_REFLECTION = 3;
  // Reflection is there but wants credentials.
  GRPC_PROBLEM_UNAUTHENTICATED = 4;
  // Credentials were sent and rejected.
  GRPC_PROBLEM_PERMISSION_DENIED = 5;
  // Reflection answered with nothing but its own service.
  GRPC_PROBLEM_NO_SERVICES = 6;
  GRPC_PROBLEM_TIMEOUT = 7;
  // The proto directory holds no .proto files, or doesn't exist.
  GRPC_PROBLEM_NO_PROTO_FILES = 8;
  // The proto files are there but don't compile.
  GRPC_PROBLEM_PROTO_INVALID = 9;
  // The URL isn't a usable gRPC target.
  GRPC_PROBLEM_TARGET = 10;
}

// InspectOpenApi reads an OpenAPI document without creating an app, so the New
// OpenAPI app form can fill itself in from the document: its title and version,
// the servers it declares, and the security schemes it accepts. The app carries
// the same parameters the app would be opened with (spec_url or spec_content, and
// the credentials used to fetch a protected document).
message InspectOpenApiRequest {
  OpenApiApp openapi = 1;
}

message InspectOpenApiResponse {
  // Set when the document was read; the form fills itself in from it.
  OpenApiDocument document = 1;
  // Set when it wasn't; the form shows it in place of the document summary.
  OpenApiProblem problem = 2;
}

message OpenApiDocument {
  string title = 1;
  // The API's own version, from info.version.
  string version = 2;
  // The OpenAPI specification version, from the openapi field.
  string openapi_version = 3;
  int32 operation_count = 4;
  int32 tag_count = 5;
  repeated OpenApiServer servers = 6;
  repeated OpenApiSecurityScheme security_schemes = 7;
  // Base URL derived from the document URL's origin, set only when the document
  // declares no servers of its own.
  string guessed_base_url = 8;
  // Whether any operation declares its own security. When it doesn't, every
  // scheme applies to every operation and the coverage counts carry no
  // information.
  bool per_operation_security = 9;
}

message OpenApiServer {
  string url = 1;
  string description = 2;
  repeated OpenApiServerVariable variables = 3;
}

// OpenApiServerVariable is one {placeholder} in a server URL. The form renders a
// select when the document enumerates the allowed values, and a text field
// otherwise.
message OpenApiServerVariable {
  string name = 1;
  string default_value = 2;
  repeated string enum_values = 3;
  string description = 4;
}

message OpenApiSecurityScheme {
  // Name of the scheme in components.securitySchemes; what security_scheme in
  // OpenApiApp refers to.
  string key = 1;
  // apiKey | http | oauth2 | openIdConnect | mutualTLS
  string type = 2;
  // The HTTP authentication scheme (bearer, basic, digest, ...) for type http.
  string scheme = 3;
  string bearer_format = 4;
  // header | query | cookie, for type apiKey.
  string in = 5;
  // Parameter name for type apiKey.
  string parameter_name = 6;
  string open_id_connect_url = 7;
  string description = 8;
  // Number of operations that accept this scheme on its own.
  int32 operation_count = 9;
  // Whether the scheme only ever appears alongside another one, which a single
  // credential per app can't satisfy.
  bool requires_others = 10;
}

// OpenApiProblem is a document that couldn't be read, classified so the form can
// name the next move instead of printing a raw error.
message OpenApiProblem {
  OpenApiProblemKind kind = 1;
  // One line, addressed to the user.
  string message = 2;
  // The underlying transport or parser error, verbatim.
  string detail = 3;
}

enum OpenApiProblemKind {
  OPEN_API_PROBLEM_UNKNOWN = 0;
  // The host couldn't be reached (DNS, TCP, TLS).
  OPEN_API_PROBLEM_UNREACHABLE = 1;
  // The document itself is behind a login (401/403).
  OPEN_API_PROBLEM_UNAUTHORIZED = 2;
  // Any other non-200 response.
  OPEN_API_PROBLEM_HTTP_ERROR = 3;
  // The response is an HTML page, almost always a login redirect or docs page.
  OPEN_API_PROBLEM_HTML = 4;
  // Parsed, but it isn't an OpenAPI document.
  OPEN_API_PROBLEM_NOT_A_DOCUMENT = 5;
  // A Swagger 2.0 document, which kaja doesn't read.
  OPEN_API_PROBLEM_SWAGGER2 = 6;
  // Not parseable as JSON or YAML.
  OPEN_API_PROBLEM_MALFORMED = 7;
}

// InspectMcp reads what an MCP server exposes without creating an app, so the
// New MCP app form can fill itself in from what answered: the server's own name
// and version, the protocol revision it speaks, and the tools, resources and
// prompts it lists. The app carries the same parameters the app would be opened
// with, credential included - an MCP server usually guards the list of its tools
// as closely as the tools themselves.
message InspectMcpRequest {
  McpApp mcp = 1;
}

message InspectMcpResponse {
  // Set when the server was read; the form fills itself in from it.
  McpServer server = 1;
  // Set when it wasn't; the form shows it in place of the summary.
  McpProblem problem = 2;
}

message McpServer {
  // What the server calls itself. Self-reported, and only ever displayed.
  string name = 1;
  string version = 2;
  // The protocol revision the exchange settled on, e.g. "2026-07-28".
  string protocol_version = 3;
  // Whether the server opened with the `initialize` handshake rather than the
  // per-request metadata the protocol uses from 2026-07-28 on.
  bool handshake = 4;
  // Every revision the server says it speaks. Only a modern server reports this.
  repeated string supported_versions = 5;
  int32 tool_count = 6;
  int32 resource_count = 7;
  int32 resource_template_count = 8;
  int32 prompt_count = 9;
  // The tools it listed, so the form can show what the app would add.
  repeated McpTool tools = 10;
  // The server's own guidance on how to use it, where it offers any.
  string instructions = 11;
}

message McpTool {
  string name = 1;
  string title = 2;
  string description = 3;
  // The server's own hint that the tool only reads. It is the server's word and
  // nothing more.
  bool read_only = 4;
}

// McpProblem is a server that couldn't be read, classified so the form can name
// the next move instead of printing a raw error.
message McpProblem {
  McpProblemKind kind = 1;
  // One line, addressed to the user.
  string message = 2;
  // The underlying transport or protocol error, verbatim.
  string detail = 3;
}

enum McpProblemKind {
  MCP_PROBLEM_UNKNOWN = 0;
  // The URL isn't a usable HTTP endpoint.
  MCP_PROBLEM_TARGET = 1;
  // The host couldn't be reached (DNS, TCP, TLS).
  MCP_PROBLEM_UNREACHABLE = 2;
  MCP_PROBLEM_TIMEOUT = 3;
  // The server wants a credential.
  MCP_PROBLEM_UNAUTHORIZED = 4;
  // A credential was sent and rejected.
  MCP_PROBLEM_FORBIDDEN = 5;
  // Any other non-200 response.
  MCP_PROBLEM_HTTP_ERROR = 6;
  // Something answered, but it doesn't speak MCP.
  MCP_PROBLEM_NOT_MCP = 7;
  // It speaks MCP and exposes nothing.
  MCP_PROBLEM_EMPTY = 8;
}

message CompileResponse {
  CompileStatus status = 1;
  repeated Log logs = 2;
  repeated Source sources = 3;
  string stub = 4;
}

enum CompileStatus {
  STATUS_UNKNOWN = 0;
  STATUS_READY = 1;
  STATUS_ERROR = 2;
  STATUS_RUNNING = 3;
}

message Log {
  LogLevel level = 1;
  string message = 2;
}

enum LogLevel {
  LEVEL_DEBUG = 0;
  LEVEL_INFO = 1;
  LEVEL_WARN = 2;
  LEVEL_ERROR = 3;
}

message Source {
  string path = 1;
  string content = 2;
}

message GetConfigurationRequest {}

message GetConfigurationResponse {
  Configuration configuration = 1;
  repeated Log logs = 2;
  // Where each configured variable's value came from, one entry per variable.
  // Neither the file nor the process, but the result of resolving one against
  // the other.
  repeated VariableStatus variable_status = 3;
  Runtime runtime = 4;
}

// Runtime is the kaja that is running, as opposed to the workspace it serves.
// Everything here is settled when the process starts and holds until it exits,
// and none of it is the user's to set: it is never read from, nor written to,
// kaja.json, and never accepted as input.
message Runtime {
  // Whether the UI can write to the configuration file. True in the desktop app,
  // which owns its workspace; false in the server, which serves a workspace
  // managed outside kaja - unless it was started with --editable.
  bool can_update_configuration = 1;
  // Git commit hash or tag for the currently running version
  string git_ref = 2;
  // TestFlight/App Store build number (CFBundleVersion), empty for other builds
  string build_number = 3;
  // Whether this machine has somewhere to store a variable's value outside
  // kaja.json (the OS keychain). False on the server, and on a desktop with no
  // usable keyring, where "${secret}" variables can only come from the
  // environment.
  bool variable_store_available = 4;
}

// VariableStatus reports where a variable's value came from. A variable whose
// value is not written in kaja.json is never sent to the UI, so this is all the
// Variables tab knows about it.
message VariableStatus {
  string name = 1;
  VariableSource source = 2;
  // The environment variable consulted for this variable: the name inside
  // ${env:...}, or KAJA_<NAME> for a "${secret}" variable. Empty for a value
  // written in kaja.json.
  string env_name = 3;
}

enum VariableSource {
  // The variable names a source, but the source holds nothing on this machine.
  VARIABLE_SOURCE_UNSET = 0;
  // The value is written in kaja.json.
  VARIABLE_SOURCE_FILE = 1;
  // The value came from the OS keychain.
  VARIABLE_SOURCE_KEYCHAIN = 2;
  // The value came from an environment variable.
  VARIABLE_SOURCE_ENVIRONMENT = 3;
}

// SetStoredValue writes a "${secret}" variable's value to the OS keychain. Only
// the desktop app has one; the web server rejects the call.
message SetStoredValueRequest {
  string name = 1;
  string value = 2;
}

message ClearStoredValueRequest {
  string name = 1;
}

message StoredValueResponse {
  repeated VariableStatus variable_status = 1;
}

message Configuration {
  // kaja can be deployed at a subpath - i.e. kaja.tools/demo
	// This field is used to set the subpath.
	// The server uses it to generate the correct paths in HTML and redirects.
	// The JS code is using relative paths and should be not dependent on this.
  string path_prefix = 1;
  // Apps are the single unit of configuration. A gRPC or Twirp service is just an
  // app of type "grpc"/"twirp"; built-in integrations like "openapi" or "folder"
  // are apps too. kaja renders and invokes every app the same way.
  repeated ConfigurationApp apps = 5;
  // User-defined variables, referenced as `${NAME}` in app configuration and read
  // from scripts as `kaja.variables.<name>`. A value is either literal, or names
  // the source that holds it outside this file: "${secret}" (the OS keychain, or
  // KAJA_<NAME> in the environment) or "${env:X}" (the environment variable X,
  // which may sit inside a longer value). Only literal values are ever sent to a
  // remote browser.
  map<string, string> variables = 6;

  // Field 2 used to hold a separate `projects` list (gRPC/Twirp services) before
  // they were unified into `apps`. Legacy config files are migrated on load.
  reserved 2;
  reserved "projects";
  // Field 4 used to hold a `system` block describing the running kaja. Those are
  // facts about the process, not configuration, and they live on `Runtime` now.
  reserved 4;
  reserved "system";
}

// ConfigurationApp is one app: a name and exactly one typed block whose key is the
// app's type. The block declares the parameters that type needs (so two types can
// never be mixed in one app); the server flattens its scalar fields to a string map
// for the app contract.
message ConfigurationApp {
  string name = 1;
  oneof app {
    GrpcApp grpc = 2;
    TwirpApp twirp = 3;
    OpenApiApp openapi = 4;
    OpenAiApp openai = 5;
    FolderApp folder = 7;
    McpApp mcp = 8;
  }

  // Field 6 used to hold a "markdown" app: the same folder on disk, behind
  // methods that each rendered one Markdown construct. It is the general
  // "folder" app now; legacy config files are migrated on load.
  reserved 6;
  reserved "markdown";
}

// GrpcApp calls a gRPC service. Its proto surface comes from a workspace-relative
// proto_dir, or from server reflection when reflection is set. headers are
// forwarded (as metadata) with each request.
//
// The credential and the transport are the app's, not the request's: kaja
// resolves them where it holds them and applies them as it makes the call, so a
// "${secret}" token is never handed to the browser and Basic's base64 is never
// something to work out by hand.
message GrpcApp {
  string url = 1;
  string proto_dir = 2;
  bool reflection = 3;
  map<string, string> headers = 4;
  // Whether to speak TLS: "on", "off", or empty to let the URL decide (an
  // https/grpcs scheme, or port 443).
  string tls = 5;
  // Accept whatever certificate the server presents. For a development server
  // with a self-signed certificate, and nothing else.
  bool insecure_skip_verify = 6;
  // PEM bundle the server's certificate is verified against, instead of the
  // system roots. Workspace-relative, like proto_dir.
  string ca_file = 7;
  // Client certificate and key kaja presents to the server (mutual TLS).
  // Workspace-relative, like proto_dir.
  string client_cert_file = 8;
  string client_key_file = 9;
  // The credential sent with every call: "bearer", "basic", "apikey", or
  // "none". Empty means none.
  string auth = 10;
  // The bearer token, or the key for the "apikey" credential.
  string token = 11;
  string username = 12;
  string password = 13;
  // Metadata key the "apikey" credential is sent under. Empty means
  // "x-api-key".
  string api_key_name = 14;
}

// TwirpApp calls a Twirp service described by a workspace-relative proto_dir.
message TwirpApp {
  string url = 1;
  string proto_dir = 2;
  map<string, string> headers = 3;
}

// OpenApiApp calls a REST API from its OpenAPI 3.x document. The document is
// taken from spec_url or, when the spec is uploaded, from spec_content (raw JSON
// or YAML). Credentials are applied per the spec's security schemes. base_url
// overrides the upstream base URL derived from the spec's servers list.
message OpenApiApp {
  string spec_url = 1;
  string token = 2;
  string username = 3;
  string password = 4;
  map<string, string> headers = 5;
  string spec_content = 6;
  string base_url = 7;
  // Which of the document's security schemes the credentials belong to, by its
  // name in components.securitySchemes. Empty picks a scheme from the document;
  // "none" sends no credentials at all.
  string security_scheme = 8;
  // A single header sent while fetching spec_url, for documents that are
  // themselves behind a login. Kept apart from the credentials above because the
  // document and the API it describes often want different tokens.
  string spec_header_name = 9;
  string spec_header_value = 10;
}

// OpenAiApp calls the OpenAI chat completions API.
message OpenAiApp {
  string endpoint = 1;
  string token = 2;
  map<string, string> headers = 3;
}

// FolderApp lists, creates, reads and appends to files in a folder on disk. It
// is local, so it forwards no headers.
message FolderApp {
  string path = 1;
}

// McpApp explores another Model Context Protocol server over the Streamable HTTP
// transport. Its proto surface is generated from what that server exposes: one
// method per tool, one per prompt, and the list/read methods for its resources.
//
// The credential is the app's, not the request's: kaja resolves it where it
// holds it and applies it on the way out, so a "${secret}" token is never handed
// to the browser.
message McpApp {
  // The server's MCP endpoint, e.g. "https://example.com/mcp".
  string url = 1;
  map<string, string> headers = 2;
  // The credential sent with every request: "bearer", "apikey", or "none". Empty
  // means bearer, which is what an MCP server behind a login nearly always
  // wants.
  string auth = 3;
  // The bearer token, or the key for the "apikey" credential.
  string token = 4;
  // Header the "apikey" credential is sent under. Empty means "X-API-Key".
  string api_key_name = 5;
}

message UpdateConfigurationRequest {
  Configuration configuration = 1;
}

message UpdateConfigurationResponse {
  Configuration configuration = 1;
  // Where each variable's value came from, re-resolved against what was saved.
  repeated VariableStatus variable_status = 2;
}