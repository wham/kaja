<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./static/favicon.svg" />
    <link rel="shortcut icon" href="./static/favicon.ico" />
    <link rel="mask-icon" href="./static/favicon.svg" color="#000000" />
    <link rel="stylesheet" href="./main.css" />
    <!-- iOS zooms into any field under 16px on focus and stays there; since iOS 10 maximum-scale no longer stops pinch zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Kaja</title>
    <style>
      /* https://stackoverflow.com/questions/47017753/monaco-editor-dynamically-resizable */
      .monaco-editor {
        position: absolute !important;
      }

      /* Prevent Safari bounce/elastic scrolling on desktop */
      html, body {
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body style="background-color: black;">
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
