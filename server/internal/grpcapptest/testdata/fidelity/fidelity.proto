// A surface with the things a real API's protos hold, so what reflection writes back
// out can be compared with what the same files generate directly.
syntax = "proto3";

package fidelity.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "example.com/fidelity/v1";

// An issue, as the API describes one.
message Issue {
  // What the API calls the issue.
  string id = 1;
  optional string note = 2;
  repeated string tags = 3;
  map<string, string> labels = 4;
  Position position = 5;
  Status status = 6;
  google.protobuf.Timestamp opened_at = 7;
  google.protobuf.Struct extras = 8;
  bytes signature = 9;
  oneof assignee {
    string user = 10;
    string team = 11;
  }
  reserved 20, 21;
  reserved "old_name";

  message Position {
    int32 line = 1;
    string path = 2;
  }

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OPEN = 1;
    STATUS_LOCKED = 2 [deprecated = true];
  }
}

message Rounding {
  double whole = 1;
  float part = 2;
  int64 big = 3;
  uint64 unsigned = 4;
  sint32 signed = 5;
  fixed32 fixed = 6;
  bool flag = 7;
  string deprecated_field = 8 [deprecated = true];
}

message Empty {}

service Issues {
  // Reads one issue.
  rpc GetIssue(Issue) returns (Issue);

  rpc ListIssues(Empty) returns (stream Issue);

  rpc OldWay(Empty) returns (Empty) {
    option deprecated = true;
  }
}
