// A proto2 surface, which is what a service written before 2016 still speaks.
syntax = "proto2";

package legacy;

message Subscription {
  required string id = 1;
  optional string note = 2;
  repeated string repos = 3;
  optional int32 count = 4 [default = 1];
  optional Kind kind = 5 [default = KIND_WATCHING];

  enum Kind {
    KIND_WATCHING = 0;
    KIND_IGNORING = 1;
  }
}

message Ack {
  optional bool ok = 1 [default = true];
}

service Subscriptions {
  rpc Subscribe(Subscription) returns (Ack);
}
